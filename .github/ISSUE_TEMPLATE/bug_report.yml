name: 버그 제보
description: SDK가 예상과 다르게 동작할 때
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **이 이슈는 누구나 볼 수 있습니다.** client_secret, access_token, 서명자 이름·연락처, 계약서 내용은 적지 마세요.
  - type: input
    id: sdk-version
    attributes:
      label: "@signok/sdk 버전"
      description: "`npm ls @signok/sdk`로 확인"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js 버전
      description: "`node -v`로 확인"
      placeholder: "v20.11.0"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 환경
      options:
        - staging
        - production
    validations:
      required: true
  - type: input
    id: method
    attributes:
      label: 호출한 메서드
      placeholder: "documents.createGeneralFromTemplate"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요?
      description: 기대한 동작과 실제 동작을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 에러 정보
      description: "에러 클래스와 `code`, `serverMessage`, `endpoint` 값"
      render: text
      placeholder: |
        SignokApiError
        code: 7004
        serverMessage: 템플릿 정보를 찾을 수 없습니다.
        endpoint: GET /api/v2/template/xxxx
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 코드
      description: 문제를 재현할 수 있는 최소한의 코드 (자격 증명과 개인정보는 가려 주세요)
      render: ts
  - type: input
    id: ids
    attributes:
      label: 문서 ID 또는 템플릿 ID (선택)
      description: 서버 쪽 확인이 필요할 때 도움이 됩니다.
  - type: checkboxes
    id: privacy
    attributes:
      label: 확인
      options:
        - label: client_secret, access_token, 개인정보를 포함하지 않았습니다.
          required: true
